[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goai-basic-descriptor-mlp"
version = "0.1.0"
description = "Fixed descriptor baseline for GOAI virtual-cell protein prediction"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "torch==2.7.1",
]

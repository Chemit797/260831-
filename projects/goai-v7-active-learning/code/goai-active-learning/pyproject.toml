[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goai-active-learning"
version = "0.2.0"
description = "Condition-atomic GOAI yeast-proteomics active-learning v2 experiment controller"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2",
  "PyYAML>=6",
  "torch>=2.4,<3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
goai-al = "goai_al.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
